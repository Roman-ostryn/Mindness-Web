kind = "web"
previewPath = "/"
title = "Mindness Website"
description = "A calm, premium one-page launch website for Mindness, an AI companion for talking, reflecting, and growing, with download call-to-actions for the upcoming mobile apps."
version = "1.0.0"
id = "artifacts/mindness-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/mindness-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mindness-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/mindness-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
